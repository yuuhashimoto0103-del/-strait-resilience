name: Update intelligence feed

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0,6,12,18 * * *"

permissions:
  contents: write

concurrency:
  group: intelligence-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests
        run: pytest -q
      - name: Update articles and weekly brief
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
        run: python scripts/update_content.py
      - name: Commit generated content
        run: |
          if git diff --quiet -- data/articles.json data/weekly.json; then
            echo "No content changes"
            exit 0
          fi
          git config user.name "strait-resilience-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/articles.json data/weekly.json
          git commit -m "chore: refresh intelligence feed"
          git push
